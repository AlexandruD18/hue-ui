version: 2
updates:
    - package-ecosystem: npm
      directory: /
      schedule:
          interval: weekly
      groups:
          dev-dependencies:
              dependency-type: development
      open-pull-requests-limit: 5
      ignore:
          # eslint-plugin-jsx-a11y supporta solo ESLint 9: togliere quando arriva il supporto a ESLint 10
          - dependency-name: "eslint"
            update-types: ["version-update:semver-major"]
          - dependency-name: "@eslint/js"
            update-types: ["version-update:semver-major"]
          # TypeScript 7 è una major: si prova in una issue dedicata
          - dependency-name: "typescript"
            update-types: ["version-update:semver-major"]
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: monthly
