name: CI

on:
    pull_request:
    push:
        branches: [main]

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    quality:
        name: Lint, format, types, unit tests, build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - run: npm run lint
            - run: npm run format:check
            - run: npm run typecheck
            - run: npm test
            - run: npm run build
            - run: npm audit --audit-level=high
            - uses: actions/upload-artifact@v4
              with:
                  name: dist
                  path: dist

    e2e:
        name: End-to-end and accessibility (axe)
        needs: quality
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - run: npx playwright install --with-deps chromium
            - run: npm run build
            - run: npm run test:e2e
            - if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: playwright-report
                  path: playwright-report

    lighthouse:
        name: Lighthouse CI
        needs: quality
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - run: npm run build
            - run: npm run lhci

    links:
        name: Link check
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: lycheeverse/lychee-action@v2
              with:
                  args: --no-progress --accept 200,403,429 --exclude "figma.com" --exclude "localhost" --exclude "github.io" README.md CHANGELOG.md
                  fail: true
